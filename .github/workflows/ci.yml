# The verification gates from CLAUDE.md, on every push and pull request.
# Nothing is published from here.
#
# `bun run i18n:check` is deliberately NOT a step: it proves German parity against the two
# source repos (toon-recipe, toon-finance), which must sit next to the checkout, so it is a
# local gate. docker-build is added by M6 together with the Dockerfile.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to the same branch makes the previous run pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # ~/.bun/install/cache is what `bun install` actually reads; keying on the
      # lockfile means a dependency change is the only thing that pays full price.
      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      # M2 re-adds the poppler install (poppler-utils) together with the PDF rasterize test.

      - name: Typecheck
        run: bun run typecheck

      # No DATABASE_URL is set on purpose: env.ts forces file::memory: under
      # NODE_ENV=test, and a runner that could reach a real database would be a bug.
      - name: Test
        run: bun test

      - name: Build web app
        run: bun run build
        env:
          # Same as the Docker build: relative URLs, so the bundle is not tied to a
          # hostname.
          PUBLIC_API_URL: ""

      # The PWA is the reason the deployment needs TLS at all, so a build that
      # silently stopped emitting a service worker must fail here rather than in
      # production three weeks later.
      - name: Assert the PWA output exists
        run: |
          test -f apps/web/dist/index.html
          test -f apps/web/dist/sw.js
          ls apps/web/dist/*.webmanifest >/dev/null
